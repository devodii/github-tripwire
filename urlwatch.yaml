# Reporter and display settings. Anything not listed keeps urlwatch's default.
display:
  new: false        # first sighting only records the baseline, nobody gets pinged
  error: true       # a watcher that breaks (404, format changed) is reported
  unchanged: false
  empty-diff: false # a change with nothing left to show (see additions_only) sends nothing

report:
  text:  # shared by stdout and telegram: compact, one message per changed watcher
    line_length: 0  # no ==== or ---- rules
    footer: false   # no urlwatch signature
    separate: true
  stdout:
    enabled: true
  telegram:
    enabled: false  # switched on automatically when TG_TOKEN and TG_CHAT are set
    error_every: 60 # minutes between repeats of the same watcher's error (0 = every time)
    bot_token: ${TG_TOKEN}
    chat_id: ${TG_CHAT}
  postgres:
    enabled: false  # switched on when DATABASE_URL is set; keeps a history in the changes table
    dsn: ${DATABASE_URL}
