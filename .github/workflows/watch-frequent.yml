name: watch frequent
# Runs every watcher with `every: frequent`. For another cadence, copy this file and change
# the cron and CADENCE, then use that name in the watchers' `every:` field.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch-frequent
  cancel-in-progress: false
env:
  CADENCE: frequent
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --no-dev
      - name: restore snapshots from the tripwire-state branch
        run: |
          git fetch origin tripwire-state || true
          if git rev-parse --verify -q origin/tripwire-state >/dev/null; then
            git worktree add state origin/tripwire-state
          else
            git worktree add --orphan -b tripwire-state state
          fi
      - run: uv run python -m tripwire check watchers --every $CADENCE
      - name: watch
        run: uv run python -m tripwire run watchers --every $CADENCE
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: save snapshots
        working-directory: state
        run: |
          git config user.name tripwire-bot
          git config user.email tripwire-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -qm "chore: update $CADENCE watch state"
          git push origin HEAD:tripwire-state
