name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  POSTGRES_SUPERUSER_PASSWORD: ci-superuser
  PGPORT: "5441"
  DATABASE_URL: postgresql://tripwire:ci-password@localhost:5441/tripwire
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python -m tripwire check watchers
      - name: start postgres and create the tripwire database
        run: uv run python -m tripwire.db up
      - run: uv run pytest -q
