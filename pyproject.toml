[project]
name = "github-tripwire"
version = "0.1.0"
description = "Watch GitHub files for content changes with urlwatch, configured in YAML"
requires-python = ">=3.11"
dependencies = [
    "urlwatch==2.29",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jq>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
