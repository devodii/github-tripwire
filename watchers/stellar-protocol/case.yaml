# Replays real stellar-protocol history through the watcher.yaml next to this file.
# Files are fetched from GitHub at these exact commits on first use and kept in the snapshots
# table of the test database, so nothing is stored in the repo.
#   6c3fb1290ccd04f30352ffe83319d67eb992eb40  parent
#   b1933843d71eea2a5b537b5a1af6592c4bdc6afe  "SEP-53: Change Status to Final (#1963)"
# Format: docs/WATCHERS.md ("Testing a watcher").
stages:
  - name: baseline is recorded silently
    serve:
      https://raw.githubusercontent.com/stellar/stellar-protocol/master/ecosystem/README.md: &index_before stellar/stellar-protocol@6c3fb1290ccd04f30352ffe83319d67eb992eb40:ecosystem/README.md
      https://raw.githubusercontent.com/stellar/stellar-protocol/master/ecosystem/sep-0053.md: &sep_before stellar/stellar-protocol@6c3fb1290ccd04f30352ffe83319d67eb992eb40:ecosystem/sep-0053.md
    expect:
      silent: true

  - name: nothing changed
    expect:
      silent: true

  - name: lines shift upstream but no value changes
    serve:
      https://raw.githubusercontent.com/stellar/stellar-protocol/master/ecosystem/README.md:
        github: *index_before
        prepend: "# Banner\n\nAnnouncement\nspanning\nlines\n\n"
      https://raw.githubusercontent.com/stellar/stellar-protocol/master/ecosystem/sep-0053.md:
        github: *sep_before
        prepend: "Extra heading\n\n"
        move_line: {startswith: "Status:", down: 2}
    expect:
      silent: true

  - name: SEP-53 goes final (the real commit)
    serve:
      https://raw.githubusercontent.com/stellar/stellar-protocol/master/ecosystem/README.md: stellar/stellar-protocol@b1933843d71eea2a5b537b5a1af6592c4bdc6afe:ecosystem/README.md
      https://raw.githubusercontent.com/stellar/stellar-protocol/master/ecosystem/sep-0053.md: stellar/stellar-protocol@b1933843d71eea2a5b537b5a1af6592c4bdc6afe:ecosystem/sep-0053.md
    expect:
      reports:
        - "-SEP-0053 | Final Comment Period (Final)"
        - "+SEP-0053 | Final"
        - "-Status: Final Comment Period (Final)"
        - "+Status: Final"
        - "+Version: 1.0.0"
      changed_lines: 6  # index: 1 out + 1 in. preamble: status and version, out and in.

  - name: the new state is the baseline now
    expect:
      silent: true

  - name: upstream format breaks and the watcher says so
    serve:
      https://raw.githubusercontent.com/stellar/stellar-protocol/master/ecosystem/README.md: {text: "404: Not Found"}
    expect:
      reports: ["ERROR", "no table with columns"]
