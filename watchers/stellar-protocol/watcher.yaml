# yaml-language-server: $schema=../../schema/watcher.schema.json
# Everything we watch in https://github.com/stellar/stellar-protocol. Spec: docs/WATCHERS.md
#
# `every: frequent` jobs are content checks (a status flips) that suit a cron. The `uses:` job
# at the bottom is the live activity feed, defined once in templates/github-repo-feed.yaml.
# It is meant for `tripwire serve --every live` and needs GH_READ_TOKEN.


# One line per SEP in the index table, so a single job covers every SEP. A line appears when a
# SEP is added to the index, changes when its title or status changes, e.g.
#   + SEP-0061 | Trustline Onboarder. | Draft                      (a new SEP)
#   - SEP-0056 | Tokenized Vault Standard | Draft                  (a status change)
#   + SEP-0056 | Tokenized Vault Standard | Final Comment Period
# The table only changes when a proposal is merged. Edits to a SEP's own document, and every
# other change under ecosystem/, come from the `stellar SEPs commits` feed at the bottom.
name: stellar SEP index
every: frequent
url: https://raw.githubusercontent.com/stellar/stellar-protocol/master/ecosystem/README.md
filter:
  - md_table:
      key: Number
      key_regex: '(SEP-\d+)'
      columns: [Title, Status]
---
# A single SEP: status and version from its preamble block.
name: stellar SEP-0053 preamble
every: frequent
url: https://raw.githubusercontent.com/stellar/stellar-protocol/master/ecosystem/sep-0053.md
filter:
  - kv_block:
      scope: fenced
      anchor: SEP
      keys: [Status, Version]
---
# The live feed: new and updated issues and PRs, comments, review comments, discussions and
# discussion comments. To watch another repository, copy this block and change owner and repo.
uses: github-repo-feed
with:
  name: stellar
  owner: stellar
  repo: stellar-protocol
---
# Every merged commit that touches ecosystem/ (all the SEP documents and their index), live.
# To follow the CAPs as well, copy this block with `path: core` and a different name.
uses: github-path-commits
with:
  name: stellar SEPs
  owner: stellar
  repo: stellar-protocol
  path: ecosystem
